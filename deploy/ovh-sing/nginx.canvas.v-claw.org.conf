server {
    listen 80;
    listen [::]:80;
    server_name canvas.v-claw.org media.canvas.v-claw.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canvas.v-claw.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/canvas.v-claw.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.v-claw.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://token.v-claw.org" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:17372/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:17372;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin https://canvas.v-claw.org;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.canvas.v-claw.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/canvas.v-claw.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.v-claw.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin https://canvas.v-claw.org always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length" always;
    add_header Vary Origin always;

    location / {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
