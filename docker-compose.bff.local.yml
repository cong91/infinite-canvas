name: infinite-canvas-bff

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas-dev-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - canvas-bff-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-migrate:
    image: postgres:16.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-canvas}
      PGUSER: ${POSTGRES_USER:-canvas}
      PGPASSWORD: ${POSTGRES_PASSWORD:-canvas-dev-password}
    volumes:
      - ./canvas-bff/migrations:/migrations:ro
      - ./canvas-bff/scripts/run-migrations.sh:/usr/local/bin/run-migrations.sh:ro
    command: ["sh", "/usr/local/bin/run-migrations.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canvas-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - canvas-bff-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canvas-dev-secret}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing local/${S3_BUCKET:-canvas-media}'
    restart: "no"

  canvas-bff:
    build:
      context: .
      dockerfile: canvas-bff/Dockerfile
    image: infinite-canvas-bff:local
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 17372
      CANVAS_ORIGIN: ${CANVAS_ORIGIN:-http://localhost:3000}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://host.docker.internal:8000}
      CANVAS_PROVIDER_MASTER_KEY: ${CANVAS_PROVIDER_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CANVAS_OBJECT_SIGNING_SECRET: ${CANVAS_OBJECT_SIGNING_SECRET:-local-only-object-signing-secret-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-canvas}:${POSTGRES_PASSWORD:-canvas-dev-password}@postgres:5432/${POSTGRES_DB:-canvas}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-canvas-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-canvas}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-canvas-dev-secret}
    ports:
      - "127.0.0.1:${CANVAS_BFF_PORT:-17372}:17372"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '17372') + '/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

volumes:
  canvas-bff-postgres-data:
  canvas-bff-minio-data:
